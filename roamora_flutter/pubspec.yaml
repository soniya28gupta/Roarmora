name: roamora_flutter
description: "Roamora — Native Flutter Dating, Video Calling & Real-World City Quests App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  flutter_webrtc: 1.6.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  confetti: ^0.7.0
  intl: ^0.19.0
  uuid: ^4.4.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
